provider: mistral
model_name: mistral-large-latest
scorer_provider: mistral
scorer_model_name: mistral-large-latest
model_api_key_env: MISTRAL_API_KEY
model_base_url: https://api.mistral.ai
scorer_api_key_env: MISTRAL_API_KEY
scorer_base_url: https://api.mistral.ai
data_path: data/dev.jsonl
sample_range: "1"
tool_profile: web
search_backend: internal
fetch_backend: none
max_steps: 3
inspect_max_samples_parallel: 1
inspect_model_max_retries: 1
inspect_attempt_timeout: 60
inspect_retry_on_error: 1
inspect_no_fail_on_error: true
inspect_continue_on_fail: true
no_sandbox: true
