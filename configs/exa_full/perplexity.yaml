provider: perplexity
model_name: sonar
scorer_provider: perplexity
scorer_model_name: sonar
model_api_key_env: PERPLEXITY_API_KEY
model_base_url: https://api.perplexity.ai
scorer_api_key_env: PERPLEXITY_API_KEY
scorer_base_url: https://api.perplexity.ai
data_path: afaji/HyperBrowseComp
sample_range: "1"
tool_profile: web
search_backend: exa
fetch_backend: exa
max_steps: 3
inspect_max_samples_parallel: 1
inspect_model_max_retries: 1
inspect_attempt_timeout: 60
inspect_retry_on_error: 1
inspect_no_fail_on_error: true
inspect_continue_on_fail: true
no_sandbox: true
