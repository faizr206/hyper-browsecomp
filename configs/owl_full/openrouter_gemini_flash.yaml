model: openai-api/openrouter/google/gemini-3.7-flash
model_api_key_env: OPENROUTER_API_KEY
model_base_url: https://openrouter.ai/api/v1

harness: owl
data_path: afaji/HyperBrowseComp
search_backend: none
fetch_backend: none
owl_browser_round_limit: 12
owl_headless: true
owl_multimodal: true
owl_task_timeout_seconds: 1200
owl_finalize_reserve_seconds: 120
owl_max_external_tool_calls: 50
owl_max_model_calls: 180
owl_model_max_retries: 1
owl_max_tokens: 8192
owl_trace_dir: logs/owl/traces

# Four isolated OWL workers fit the validated 14-core/36-GiB host. Reduce this
# if the model provider rate-limits requests or Chromium memory pressure grows.
inspect_max_samples_parallel: 4
inspect_model_max_retries: 1
inspect_attempt_timeout: 1260
inspect_retry_on_error: 0
inspect_no_fail_on_error: true
inspect_continue_on_fail: true
inspect_ctl_server: false
no_sandbox: true
log_dir: logs/owl
