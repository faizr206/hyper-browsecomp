provider: openai
model_name: gpt-5.4-mini
scorer_provider: openai
scorer_model_name: gpt-5.4-mini
model_api_key_env: OPENAI_API_KEY
model_base_url: https://api.openai.com/v1
scorer_api_key_env: OPENAI_API_KEY
scorer_base_url: https://api.openai.com/v1
data_path: data/dev.jsonl
sample_range: "1"
tool_profile: web
search_backend: internal
fetch_backend: none
max_steps: 3
inspect_max_samples_parallel: 1
inspect_model_max_retries: 1
inspect_attempt_timeout: 60
inspect_retry_on_error: 1
inspect_no_fail_on_error: true
inspect_continue_on_fail: true
no_sandbox: true
