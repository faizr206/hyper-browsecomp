model: openai-api/openrouter/google/gemini-3.7-flash
model_api_key_env: OPENROUTER_API_KEY
model_base_url: https://openrouter.ai/api/v1

harness: owl
data_path: data/owl_video_smoke.jsonl
sample_range: "1"

search_backend: none
fetch_backend: none
owl_browser_round_limit: 6
owl_headless: true
owl_multimodal: true
owl_task_timeout_seconds: 900
owl_finalize_reserve_seconds: 120
owl_max_external_tool_calls: 50
owl_max_model_calls: 180
owl_model_max_retries: 1
owl_max_tokens: 4096
owl_trace_dir: logs/owl/traces

inspect_max_samples_parallel: 1
inspect_model_max_retries: 1
inspect_attempt_timeout: 960
inspect_retry_on_error: 0
inspect_no_fail_on_error: true
inspect_continue_on_fail: true
inspect_ctl_server: false
no_sandbox: true
log_dir: logs/owl
