provider: gemini
model_name: gemini-2.5-pro
scorer_provider: gemini
scorer_model_name: gemini-2.5-pro
model_api_key_env: GOOGLE_API_KEY
model_base_url: https://generativelanguage.googleapis.com
scorer_api_key_env: GOOGLE_API_KEY
scorer_base_url: https://generativelanguage.googleapis.com
data_path: data/dev.jsonl
sample_range: "1"
tool_profile: web
search_backend: exa
fetch_backend: exa
max_steps: 3
inspect_max_samples_parallel: 1
inspect_model_max_retries: 1
inspect_attempt_timeout: 60
inspect_retry_on_error: 1
inspect_no_fail_on_error: true
inspect_continue_on_fail: true
no_sandbox: true
